# Auto-deploy Polaris Web to the EC2 box on every push to main.
#
# Identical to the polaris workflow — both repos trigger the same redeploy.sh
# living in the polaris repo on the VM. That script pulls BOTH repos and rebuilds
# everything, so it doesn't matter which side pushed first.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     public IP or DNS of the VM
#   EC2_USER     SSH user, usually `ubuntu`
#   EC2_SSH_KEY  full PEM of the private SSH key

name: Deploy Polaris Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-polaris
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger redeploy on the VM
        run: |
          ssh -i ~/.ssh/deploy.pem \
              -o ServerAliveInterval=20 \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "/home/${{ secrets.EC2_USER }}/polaris/deploy/redeploy.sh"
