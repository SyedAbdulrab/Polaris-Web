# Build the Polaris Web image in CI and push it to GHCR.
#
# Twist vs the API: Next.js inlines NEXT_PUBLIC_* into the JS bundle at BUILD
# time (not runtime). Since the build now happens here in CI rather than on the
# VM, CI must supply NEXT_PUBLIC_API_URL as a docker build-arg. It's the public
# API URL (visible in every browser), so it's safe to set in plaintext here.
# Change the API domain → bump this value → rebuild the image.

name: Build & Push Polaris Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # Not a secret — this ends up in the public JS bundle. Edit here if the API
  # domain ever changes (or move it to a repo Variable: ${{ vars.PUBLIC_API_URL }}).
  PUBLIC_API_URL: https://api.abdulrab.store

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/polaris-web
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
